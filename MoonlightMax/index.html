<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciativa de Estandarización - Proceso de Cuantificación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { tech: { bg: '#030712', card: '#0b1329', border: '#1e293b', accent: '#06b6d4', secondary: '#8b5cf6' } }
                }
            }
        }
    </script>
    <style>
        .slide-fade { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .modal-fade { animation: modalIn 0.2s ease-out forwards; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col justify-between p-6 md:p-10 overflow-hidden relative select-none">

    <div class="absolute -top-40 -left-40 w-96 h-96 bg-cyan-500/5 rounded-full blur-[100px] pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-violet-500/5 rounded-full blur-[100px] pointer-events-none"></div>

    <header class="flex items-center justify-between z-20 shrink-0">
        <div class="flex items-center gap-2 bg-slate-900/60 border border-slate-800 px-3 py-1 rounded-full">
            <span class="inline-block w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
            <span id="slide-index-badge" class="text-[10px] font-mono text-cyan-400 font-bold uppercase">FICHA 1 DE 7</span>
        </div>
        <div class="text-right">
            <p class="text-xs font-bold text-slate-200" id="final-prof-name"></p>
            <p class="text-[10px] text-slate-400 mt-0.5" id="final-prof-role"></p>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center overflow-y-auto my-4">
        <div class="w-full max-w-4xl mx-auto" id="slide-content-stage"></div>
    </main>

    <footer class="flex items-center justify-between border-t border-slate-800/50 pt-4 z-20 shrink-0">
        <div class="flex items-center gap-1.5" id="dots-container"></div>
        <div class="flex gap-2">
            <button onclick="navigateSlide(-1)" class="p-2 rounded-xl border border-slate-800 bg-slate-900/80 hover:bg-slate-800 text-slate-400 hover:text-white transition-all">
                <i class="fa-solid fa-chevron-left text-xs"></i>
            </button>
            <button onclick="navigateSlide(1)" class="p-2 rounded-xl border border-slate-800 bg-slate-900/80 hover:bg-slate-800 text-slate-400 hover:text-white transition-all">
                <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>
        </div>
    </footer>

    <div id="deal-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6 bg-slate-950/80 backdrop-blur-sm">
        <div class="modal-fade w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 relative shadow-2xl shadow-cyan-500/5">
            <button onclick="closeDealModal()" class="absolute top-4 right-4 h-8 w-8 rounded-lg border border-slate-800 bg-slate-900/80 hover:bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center transition-all">
                <i class="fa-solid fa-xmark text-xs"></i>
            </button>
            <div id="deal-modal-content"></div>
        </div>
    </div>

    <script>
        const state = {
  "profile": { "name": "Raúl Máximo González Luna", "role": "Sistemas Especiales / BIM" },
  "slides": [
    {
      "title": "Iniciativa de Estandarización y optimización de procesos —<span class=\"text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-violet-400\">&nbsp;Cuantificación</span>",
      "badge": "· ESTANDARIZACIÓN Y OPTIMIZACIÓN",
      "subtitle": "Presentación ejecutiva para la optimización y aceleración de flujos de trabajo en Revit.",
      "bullets": [
        { "icon": "fa-user-gear", "text": "Raúl Máximo González Luna · Sistemas Especiales" },
        { "icon": "fa-cubes-stacked", "text": "Propuesta de integración tecnológica y estandarización in-house" }
      ]
    },
    {
      "title": "Situación Actual: <span class=\"text-transparent bg-clip-text bg-gradient-to-r from-rose-400 to-amber-400\">Proceso Manual</span>",
      "badge": "· ESTADO ACTUAL",
      "subtitle": "Generación de catálogos de conceptos: cantidades de dispositivos, cableado, canalizaciones y bandejas portacable.",
      "bullets": [
        { "icon": "fa-hand-pointer", "text": "Proceso manual: creación de tablas, mediciones y parámetros creados a mano en el modelo." },
        { "icon": "fa-user-slash", "text": "Dependencia técnica: el resultado depende directamente de la experiencia de cada diseñador / modelador." },
        { "icon": "fa-clock", "text": "Inversión de tiempo actual: horas o días dedicados a cuantificar por cada proyecto." }
      ]
    },
    {
      "title": "Iniciativa: <span class=\"text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-violet-400\">In-house tools for Revit</span>",
      "badge": "· LA INICIATIVA",
      "subtitle": "Set de herramientas personalizadas para Revit, actualmente en desarrollo continuo.\n\n\nMoonlight -  Conduit Tools:",
      "bullets": [
        { "icon": "fa-sliders", "text": "Objetivo 1 — Estandarizar el proceso de cuantificación bajo un criterio homogéneo. Hoy, la forma de cuantificar depende de quién lo hace: cada colaborador resuelve tablas, mediciones y parámetros a su manera, con su propio criterio de clasificación. Eso genera variaciones entre proyectos, incluso entre modeladores del mismo equipo. Un mismo criterio de clasificación, sin importar quién ejecute la cuantificación Resultados comparables entre proyectos, sin depender de la experiencia individual. Reduce el margen de error humano por interpretación o método distinto.\nFacilita revisar y validar la información, porque siempre se presenta de la misma forma." },
        { "icon": "fa-bolt", "text": "Objetivo 2 — Agilizar la extracción de información al máximo nivel posible. El objetivo no es solo estandarizar, sino eliminar el tiempo que hoy se destina a un proceso mecánico, para reinvertirlo en tareas que sí requieren criterio técnico. Extracción de cantidades en segundos, no en horas o días No requiere crear tablas, mediciones o parámetros manualmente No depende de que el diseñador o modelador sepa ejecutar el proceso por su cuenta. Libera tiempo de diseño para enfocarlo en la ingeniería del sistema, no en su conteo." }
      ]
    },
    {
      "title": "El Resultado: <span class=\"text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400\">Días a Segundos</span>",
      "badge": "· RESULTADO",
      "subtitle": "Transformación radical en velocidad, precisión e independencia técnica.",
      "comparisons": [
        { "label": "Tiempo", "manual": "Antes: horas o días por proyecto", "auto": "Ahora: seleccion de parámetros 5 segundos + extracción en 5 segundos" },
        { "label": "Trabajo Manual", "manual": "Creación manual de tablas, mediciones y parámetros", "auto": "Cero necesidad de crear tablas o parámetros a mano." },
        { "label": "Nivel de Experiencia", "manual": "Depende de que el colaborador sepa configurarlo", "auto": "Independiente: no requiere que el diseñador/modelador lo sepa hacer" }
      ]
    },
    {
      "title": "Alcance Propuesto: <span class='text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-violet-400'>Visión Multidisciplina</span>",
      "badge": "· ALCANCE",
      "subtitle": "Ampliación de la automatización más allá de un departamento.",
      "cards": [
        { "number": "01", "name": "Exploración de Áreas", "badge": "Apertura", "desc": "No limitado a Sistemas Especiales; extensible a HVAC, Eléctricas, PLBG, PCI, BIM, etc." },
        { "number": "02", "name": "Estandarización", "badge": "Diagnóstico", "desc": "Identificar y estandarizar procesos repetitivos similares en otras disciplinas." },
        { "number": "03", "name": "Rol en Equipo BIM", "badge": "Integración", "desc": "Rol activo dentro del equipo BIM para identificar y resolver procesos optimizables." }
      ]
    },
    {
      "title": "Propuesta de Rol & <span class='text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-violet-400'>Evolución</span>",
      "badge": "· ESTRUCTURA",
      "subtitle": "Continuar con las labores principales e incorporar la nueva función formal de desarrollo.",
      "distribution": [
        { "pct": "70%", "name": "Diseño en Sistemas Especiales", "desc": "Garantizar la continuidad, responsabilidad y coordinación en proyectos asignados." },
        { "pct": "30%", "name": "Desarrollo y Estandarización BIM", "desc": "Nueva función formal: desarrollo y estandarización de herramientas para el equipo BIM." }
      ],
      "note": "Diseño y modelado + nueva función formal de desarrollo."
    },
    {
      "title": "Futuro: <span class=\"text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400\">Beneficio Mutuo</span>",
      "badge": "· CIERRE",
      "subtitle": "Ganancia inmediata en velocidad, estandarización y autonomía técnica.",
      "bullets": [
        { "icon": "fa-trophy", "text": "Ganancia clara: estandarización + velocidad, reduciendo la dependencia de la experiencia individual." },
        { "icon": "fa-handshake", "text": "Primer paso de una serie de herramientas pensadas para estandarizar los procesos clave del área." }
      ]
    }
  ]
};

        // Contenido que antes era la ficha 7 ("Herramienta Ya Desarrollada: Marco de Acuerdo").
        // Ya no es una diapositiva fija: se abre como modal desde el botón al final de la ficha 6.
        const dealSlide = {
            "badge": "· PROPUESTA",
            "title": "Herramienta Ya Desarrollada: <span class=\"text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-violet-400\">Marco de Acuerdo</span>",
            "subtitle": "Opciones para la integración del software ya desarrollado",
            "cards": [
                { "number": "01", "name": "Uso Interno Incluido", "badge": "SIN COSTO", "desc": "Uso interno sin costo, incluido dentro del ajuste salarial propuesto." },
                { "number": "02", "name": "Derecho de Uso", "badge": "PROPIEDAD", "desc": "La propiedad se mantiene con el autor y se otorga a la empresa el derecho de uso interno." },
                { "number": "03", "name": "Formalización", "badge": "Por Escrito", "desc": "Acuerdo transparente a formalizar por escrito entre ambas partes." }
            ]
        };

        let activeSlideIndex = 0;

        window.onload = function() {
            document.getElementById('final-prof-name').innerText = state.profile.name;
            document.getElementById('final-prof-role').innerText = state.profile.role;
            renderSlide();
        };

        function renderSlide() {
            const slide = state.slides[activeSlideIndex];
            document.getElementById('slide-index-badge').innerText = "FICHA " + (activeSlideIndex + 1) + " DE " + state.slides.length;

            let dotsHtml = '';
            for (let i = 0; i < state.slides.length; i++) {
                dotsHtml += '<button onclick="jumpToSlide(' + i + ')" class="h-2 rounded-full transition-all ' + (i === activeSlideIndex ? 'w-6 bg-cyan-400' : 'w-2 bg-slate-800 hover:bg-slate-700') + '"></button>';
            }
            document.getElementById('dots-container').innerHTML = dotsHtml;

            let html = '<div class="slide-fade space-y-6 text-left">' +
                '<div class="space-y-2">' +
                '<span class="inline-block px-2.5 py-1 bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 rounded-full text-[10px] font-bold tracking-wider font-mono uppercase">' + slide.badge + '</span>' +
                '<h2 class="text-2xl md:text-4xl font-black leading-tight text-white">' + slide.title + '</h2>' +
                '<p class="text-xs md:text-sm text-slate-400 leading-relaxed max-w-3xl">' + slide.subtitle + '</p>' +
                '</div>';

            if (slide.bullets) {
                html += '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4">' +
                    slide.bullets.map(function(bullet) {
                        return '<div class="p-4 rounded-xl bg-slate-900/40 border border-slate-800/80 flex gap-3.5 items-start">' +
                            '<div class="h-8 w-8 rounded-lg bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 shrink-0 mt-0.5">' +
                            '<i class="fa-solid ' + bullet.icon + ' text-xs"></i>' +
                            '</div>' +
                            '<p class="text-xs text-slate-300 font-medium leading-relaxed">' + bullet.text + '</p>' +
                            '</div>';
                    }).join('') + '</div>';
            } else if (slide.comparisons) {
                html += '<div class="overflow-hidden border border-slate-800 rounded-xl bg-slate-900/20 pt-2">' +
                    '<table class="w-full text-left border-collapse">' +
                    '<thead>' +
                    '<tr class="border-b border-slate-800">' +
                    '<th class="py-2.5 px-4 text-[9px] font-bold text-slate-500 font-mono uppercase tracking-wider">Aspecto</th>' +
                    '<th class="py-2.5 px-4 text-[9px] font-bold text-rose-400 font-mono uppercase tracking-wider bg-rose-950/10">Antes (Tradicional)</th>' +
                    '<th class="py-2.5 px-4 text-[9px] font-bold text-cyan-400 font-mono uppercase tracking-wider bg-cyan-950/10">Ahora (Automatizado)</th>' +
                    '</tr>' +
                    '</thead>' +
                    '<tbody class="divide-y divide-slate-800/60 text-xs">' +
                    slide.comparisons.map(function(row) {
                        return '<tr class="hover:bg-slate-900/30 transition-colors">' +
                            '<td class="py-3 px-4 font-bold text-slate-300">' + row.label + '</td>' +
                            '<td class="py-3 px-4 text-slate-400 bg-rose-950/5 leading-relaxed">' + row.manual + '</td>' +
                            '<td class="py-3 px-4 text-slate-300 bg-cyan-950/5 leading-relaxed">' + row.auto + '</td>' +
                            '</tr>';
                    }).join('') +
                    '</tbody>' +
                    '</table>' +
                    '</div>';
            } else if (slide.cards) {
                html += '<div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-4">' +
                    slide.cards.map(function(card, cIdx) {
                        var cardBorder = cIdx === 0 ? 'border-cyan-500/40 shadow-lg shadow-cyan-500/5' : 'border-slate-800/80';
                        var badgeStyle = cIdx === 0 ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/20' : 'bg-slate-800 text-slate-400';
                        return '<div class="p-4 rounded-xl bg-slate-900/40 border ' + cardBorder + ' flex flex-col justify-between space-y-4">' +
                            '<div class="space-y-2">' +
                            '<div class="flex justify-between items-center">' +
                            '<span class="text-base font-mono font-black text-slate-600">' + card.number + '</span>' +
                            '<span class="text-[8px] font-mono px-2 py-0.5 rounded-full ' + badgeStyle + ' font-bold uppercase tracking-wider">' + card.badge + '</span>' +
                            '</div>' +
                            '<h4 class="text-xs font-bold text-white">' + card.name + '</h4>' +
                            '</div>' +
                            '<p class="text-[11px] text-slate-400 leading-relaxed">' + card.desc + '</p>' +
                            '</div>';
                    }).join('') + '</div>';
            } else if (slide.distribution) {
                html += '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4">' +
                    slide.distribution.map(function(dist) {
                        return '<div class="p-4 rounded-xl bg-slate-900/40 border border-slate-800 flex flex-col justify-between space-y-3">' +
                            '<div class="space-y-1">' +
                            '<div class="flex items-center justify-between">' +
                            '<h4 class="text-xs font-bold text-white">' + dist.name + '</h4>' +
                            '<span class="text-sm font-mono font-black text-cyan-400">' + dist.pct + '</span>' +
                            '</div>' +
                            '<div class="w-full bg-slate-950 h-1.5 rounded-full overflow-hidden mt-2">' +
                            '<div class="bg-gradient-to-r from-cyan-500 to-violet-500 h-full rounded-full" style="width: ' + dist.pct + '"></div>' +
                            '</div>' +
                            '</div>' +
                            '<p class="text-[11px] text-slate-400 leading-relaxed">' + dist.desc + '</p>' +
                            '</div>';
                    }).join('') + '</div>';
                if (slide.note) {
                    html += '<div class="mt-4 p-3 rounded-xl bg-cyan-500/10 border border-cyan-500/20 text-xs text-cyan-300 flex items-center gap-2">' +
                        '<i class="fa-solid fa-award text-cyan-400"></i>' +
                        '<span>' + slide.note + '</span>' +
                        '</div>';
                }
                html += '<div class="mt-4">' +
                    '<button onclick="openDealModal()" class="px-4 py-2.5 rounded-xl bg-slate-900/60 border border-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-800 transition-all flex items-center gap-2">' +
                    '<i class="fa-solid fa-file-contract text-[10px]"></i> Ver marco de acuerdo de la herramienta</button>' +
                    '</div>';
            }

            html += '</div>';
            document.getElementById('slide-content-stage').innerHTML = html;
        }

        function renderDealModal() {
            let html = '<div class="space-y-2 mb-5">' +
                '<span class="inline-block px-2.5 py-1 bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 rounded-full text-[10px] font-bold tracking-wider font-mono uppercase">' + dealSlide.badge + '</span>' +
                '<h3 class="text-xl md:text-2xl font-black leading-tight text-white">' + dealSlide.title + '</h3>' +
                '<p class="text-xs text-slate-400 leading-relaxed">' + dealSlide.subtitle + '</p>' +
                '</div>';
            html += '<div class="grid grid-cols-1 md:grid-cols-3 gap-3">' +
                dealSlide.cards.map(function(card, cIdx) {
                    var cardBorder = cIdx === 0 ? 'border-cyan-500/40 shadow-lg shadow-cyan-500/5' : 'border-slate-800/80';
                    var badgeStyle = cIdx === 0 ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/20' : 'bg-slate-800 text-slate-400';
                    return '<div class="p-4 rounded-xl bg-slate-950/60 border ' + cardBorder + ' flex flex-col justify-between space-y-3">' +
                        '<div class="space-y-2">' +
                        '<div class="flex justify-between items-center">' +
                        '<span class="text-base font-mono font-black text-slate-600">' + card.number + '</span>' +
                        '<span class="text-[8px] font-mono px-2 py-0.5 rounded-full ' + badgeStyle + ' font-bold uppercase tracking-wider">' + card.badge + '</span>' +
                        '</div>' +
                        '<h4 class="text-xs font-bold text-white">' + card.name + '</h4>' +
                        '</div>' +
                        '<p class="text-[11px] text-slate-400 leading-relaxed">' + card.desc + '</p>' +
                        '</div>';
                }).join('') + '</div>';
            document.getElementById('deal-modal-content').innerHTML = html;
        }

        function openDealModal() {
            renderDealModal();
            document.getElementById('deal-modal').classList.remove('hidden');
        }

        function closeDealModal() {
            document.getElementById('deal-modal').classList.add('hidden');
        }

        function jumpToSlide(idx) {
            activeSlideIndex = idx;
            renderSlide();
        }

        function navigateSlide(dir) {
            var next = activeSlideIndex + dir;
            if (next >= 0 && next < state.slides.length) {
                jumpToSlide(next);
            }
        }

        document.onkeydown = function(e) {
            if (document.getElementById('deal-modal').classList.contains('hidden')) {
                if (e.key === "ArrowLeft") navigateSlide(-1);
                if (e.key === "ArrowRight" || e.key === " ") {
                    e.preventDefault();
                    navigateSlide(1);
                }
            }
            if (e.key === "Escape") closeDealModal();
        };
    </script>
</body>
</html>
